<svg width="680" height="480" viewBox="0 0 680 480"
     xmlns="http://www.w3.org/2000/svg"
     role="img">

  <title>Top-down view of the rotating medicine tray</title>

  <desc>
    A circular tray divided into 5 wedge-shaped compartments, driven by a
    stepper motor at the center. The tray rotates clockwise to bring each
    compartment to the fixed dispensing position under the lid and IR sensor.
  </desc>

  <defs>
    <!-- Clockwise arrow marker -->
    <marker id="arrow"
            viewBox="0 0 10 10"
            refX="8"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto">
      <path d="M2 1 L8 5 L2 9"
            fill="none"
            stroke="#c9d1d9"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- GitHub dark background -->
  <rect width="680" height="480" fill="#0d1117"/>

  <!-- ========================= -->
  <!-- Complete circular tray -->
  <!-- ========================= -->

  <circle cx="300"
          cy="230"
          r="170"
          fill="#30363d"
          stroke="#8b949e"
          stroke-width="1.2"/>

  <!-- Slot 1 highlighted -->
  <path d="M300 230
           L300 60
           A170 170 0 0 1 461.8 178.5
           Z"
        fill="#9FE1CB"/>

  <!-- ========================= -->
  <!-- Compartment divider lines -->
  <!-- ========================= -->

  <line x1="300" y1="230"
        x2="300" y2="60"
        stroke="#8b949e"
        stroke-width="1.2"/>

  <line x1="300" y1="230"
        x2="461.8" y2="178.5"
        stroke="#8b949e"
        stroke-width="1.2"/>

  <line x1="300" y1="230"
        x2="402.1" y2="375.6"
        stroke="#8b949e"
        stroke-width="1.2"/>

  <line x1="300" y1="230"
        x2="197.9" y2="375.6"
        stroke="#8b949e"
        stroke-width="1.2"/>

  <line x1="300" y1="230"
        x2="138.2" y2="178.5"
        stroke="#8b949e"
        stroke-width="1.2"/>

  <!-- ========================= -->
  <!-- Slot labels -->
  <!-- ========================= -->

  <!-- Slot 1 -->
  <text x="365"
        y="136"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="14"
        font-weight="600"
        fill="#085041">
    Slot 1
  </text>

  <text x="365"
        y="153"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="11"
        fill="#0F6E56">
    dispensing
  </text>

  <!-- Slot 2 -->
  <text x="405"
        y="278"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="14"
        font-weight="500"
        fill="#c9d1d9">
    Slot 2
  </text>

  <!-- Slot 3 -->
  <text x="300"
        y="340"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="14"
        font-weight="500"
        fill="#c9d1d9">
    Slot 3
  </text>

  <!-- Slot 4 -->
  <text x="195"
        y="278"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="14"
        font-weight="500"
        fill="#c9d1d9">
    Slot 4
  </text>

  <!-- Slot 5 -->
  <text x="235"
        y="136"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="14"
        font-weight="500"
        fill="#c9d1d9">
    Slot 5
  </text>

  <!-- ========================= -->
  <!-- Stepper motor -->
  <!-- ========================= -->

  <circle cx="300"
          cy="230"
          r="34"
          fill="#F5C4B3"
          stroke="#993C1D"
          stroke-width="1"/>

  <text x="300"
        y="225"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="12"
        fill="#712B13">
    Stepper
  </text>

  <text x="300"
        y="240"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="12"
        fill="#712B13">
    motor
  </text>

  <!-- ========================= -->
  <!-- CLOCKWISE ROTATION ARROW -->
  <!-- ========================= -->

  <!-- Large curved arrow outside tray -->
  <path d="M465 105
           A205 205 0 0 1 515 250"
        fill="none"
        stroke="#c9d1d9"
        stroke-width="2"
        stroke-linecap="round"
        marker-end="url(#arrow)"/>

  <text x="539"
        y="125"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="13"
        font-weight="500"
        fill="#c9d1d9">
    Clockwise
  </text>

  <text x="540"
        y="140"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="11"
        fill="#8b949e">
    410 steps / slot
  </text>

  <!-- ========================= -->
  <!-- Fixed lid + IR sensor -->
  <!-- ========================= -->

  <rect x="230"
        y="25"
        width="140"
        height="30"
        rx="6"
        fill="#FAC775"
        stroke="#854F0B"
        stroke-width="0.8"/>

  <text x="300"
        y="49"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="14"
        font-weight="500"
        fill="#412402">
    Lid + IR sensor
  </text>

  <!-- Lid alignment arrow -->
  

  <!-- ========================= -->
  <!-- Bottom explanation -->
  <!-- ========================= -->

  <text x="300"
        y="440"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="12"
        fill="#8b949e">
    Motor rotates the tray in fixed 410-step increments
  </text>

  <text x="300"
        y="458"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="12"
        fill="#8b949e">
    to bring each slot under the fixed lid
  </text>

</svg>