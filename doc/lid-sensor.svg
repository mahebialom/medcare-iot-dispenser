<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Cross-section of the dispensing slot showing the lid and IR sensor</title>
  <desc>
    Side view of one slot at the fixed dispensing position:
    a servo-driven lid swings open above the slot, and an IR sensor
    beam across the opening detects when the medicine strip is removed
    and later returned.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10"
            refX="8" refY="5"
            markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9"
            fill="none"
            stroke="#c9d1d9"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- GitHub dark-theme background -->
  <rect width="680" height="400" fill="#0d1117"/>

  <!-- Tray -->
  <rect x="120" y="220"
        width="440"
        height="80"
        rx="10"
        fill="#30363d"
        stroke="#8b949e"
        stroke-width="0.8"/>

  <text x="140" y="212"
        font-family="sans-serif"
        font-size="12"
        fill="#8b949e">
    Tray (rotates in, then holds still)
  </text>

  <!-- Medicine strip -->
  <rect x="260" y="150"
        width="160"
        height="70"
        rx="6"
        fill="#9FE1CB"
        stroke="#0F6E56"
        stroke-width="0.8"/>

  <text x="340" y="180"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="14"
        font-weight="500"
        fill="#085041">
    Medicine
  </text>

  <text x="340" y="198"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="12"
        fill="#0F6E56">
    strip
  </text>

  <!-- Servo-driven lid -->
  <path d="M230 150
           Q230 110 270 100
           L410 100
           Q450 110 450 150"
        fill="none"
        stroke="#c9d1d9"
        stroke-width="2"
        stroke-linecap="round"
        transform="rotate(-40 270 100)"/>

  <!-- Servo pivot -->
  <circle cx="270" cy="100"
          r="4"
          fill="#c9d1d9"/>

  <!-- Lid labels -->
  <text x="150" y="90"
        font-family="sans-serif"
        font-size="12"
        fill="#c9d1d9">
    Servo-driven lid
  </text>

  <text x="150" y="106"
        font-family="sans-serif"
        font-size="12"
        fill="#8b949e">
    (open position shown)
  </text>

  <line x1="230" y1="95"
        x2="150" y2="95"
        stroke="#484f58"
        stroke-width="0.8"
        stroke-dasharray="3 2"/>

  <!-- IR sensor beam -->
  <line x1="240" y1="130"
        x2="440" y2="130"
        stroke="#EF9F27"
        stroke-width="1.5"
        stroke-dasharray="4 3"
        opacity="0.95"/>

  <!-- IR sensor emitters/receivers -->
  <circle cx="240" cy="130"
          r="4"
          fill="#FAC775"
          stroke="#EF9F27"
          stroke-width="0.8"/>

  <circle cx="440" cy="130"
          r="4"
          fill="#FAC775"
          stroke="#EF9F27"
          stroke-width="0.8"/>

  <!-- IR labels -->
  <text x="480" y="126"
        font-family="sans-serif"
        font-size="12"
        fill="#c9d1d9">
    IR beam
  </text>

  <text x="480" y="142"
        font-family="sans-serif"
        font-size="12"
        fill="#8b949e">
    strip present/absent
  </text>

  <!-- Bottom explanation -->
  <text x="340" y="340"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="12"
        fill="#c9d1d9">
    Beam broken = strip present. Beam clear = removed.
  </text>

  <text x="340" y="358"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="12"
        fill="#8b949e">
    Clear then broken again = returned.
  </text>
</svg>